<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Preview 04 - Form Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-stone-100 font-sans text-stone-800">
    <div class="min-h-screen">
      <header class="border-b border-stone-400 bg-stone-800 text-white">
        <div class="flex items-center justify-between px-5 py-4">
          <div>
            <div class="text-xs uppercase tracking-[0.28em] text-stone-300">ERP Preview 04</div>
            <div class="mt-1 text-3xl font-bold">KRISHIV Entry and Ledger Screen</div>
          </div>
          <div class="text-sm">Focused on forms + right-side live ledger</div>
        </div>
      </header>
      <main class="grid gap-4 p-4 xl:grid-cols-[0.9fr_1.1fr]">
        <section class="border border-stone-400 bg-white">
          <div class="border-b border-stone-400 bg-stone-50 px-4 py-2 font-semibold">Crop Registration and Receipt Form</div>
          <div class="space-y-4 p-4">
            <div class="grid gap-3 md:grid-cols-2">
              <label class="text-sm"><div class="mb-1 font-semibold">Farmer Name</div><input class="w-full border border-stone-400 px-3 py-2" value="Abdul Majid" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">Reg. Code</div><input class="w-full border border-stone-400 px-3 py-2" value="R25-4-423" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">Village</div><input class="w-full border border-stone-400 px-3 py-2" value="Atru" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">District</div><input class="w-full border border-stone-400 px-3 py-2" value="Baran" /></label>
            </div>
            <div class="grid gap-3 md:grid-cols-2">
              <label class="text-sm"><div class="mb-1 font-semibold">Gross Weight (QTL)</div><input class="w-full border border-stone-400 px-3 py-2" value="97.20" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">Bags</div><input class="w-full border border-stone-400 px-3 py-2" value="188" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">Net Weight (QTL)</div><input class="w-full border border-stone-400 px-3 py-2" value="96.83" /></label>
              <label class="text-sm"><div class="mb-1 font-semibold">Moisture %</div><input class="w-full border border-stone-400 px-3 py-2" value="11.2" /></label>
            </div>
            <label class="text-sm"><div class="mb-1 font-semibold">Remarks</div><textarea class="min-h-24 w-full border border-stone-400 px-3 py-2">Minor discrepancy but within reviewable range.</textarea></label>
            <div class="flex gap-2">
              <button class="border border-stone-800 bg-stone-800 px-4 py-2 text-sm font-semibold text-white">Save Entry</button>
              <button class="border border-stone-500 bg-stone-200 px-4 py-2 text-sm font-semibold">Update</button>
              <button class="border border-emerald-700 bg-emerald-700 px-4 py-2 text-sm font-semibold text-white">Generate Slip</button>
            </div>
          </div>
        </section>
        <section class="border border-stone-400 bg-white">
          <div class="border-b border-stone-400 bg-stone-50 px-4 py-2 font-semibold">Live Registration Ledger</div>
          <div class="grid gap-3 p-4 md:grid-cols-4">
            <div class="border border-stone-300 bg-stone-50 p-3"><div class="text-xs uppercase text-stone-500">Expected</div><div class="mt-2 text-xl font-bold">98.00</div></div>
            <div class="border border-stone-300 bg-stone-50 p-3"><div class="text-xs uppercase text-stone-500">Received</div><div class="mt-2 text-xl font-bold">96.83</div></div>
            <div class="border border-stone-300 bg-stone-50 p-3"><div class="text-xs uppercase text-stone-500">Balance</div><div class="mt-2 text-xl font-bold">1.17</div></div>
            <div class="border border-stone-300 bg-stone-50 p-3"><div class="text-xs uppercase text-stone-500">Status</div><div class="mt-2 text-xl font-bold">ACTIVE</div></div>
          </div>
          <div class="overflow-x-auto p-4">
            <table class="min-w-full border-collapse text-sm">
              <thead class="bg-stone-800 text-white">
                <tr>
                  <th class="border border-stone-400 px-3 py-2 text-left">Receipt No.</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Date</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Gross</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Net</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Bags</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Stack</th>
                  <th class="border border-stone-400 px-3 py-2 text-left">Voucher</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="border border-stone-300 px-3 py-2">114</td>
                  <td class="border border-stone-300 px-3 py-2">2026-04-10</td>
                  <td class="border border-stone-300 px-3 py-2">97.20</td>
                  <td class="border border-stone-300 px-3 py-2">96.83</td>
                  <td class="border border-stone-300 px-3 py-2">188</td>
                  <td class="border border-stone-300 px-3 py-2">05</td>
                  <td class="border border-stone-300 px-3 py-2">Pending</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
